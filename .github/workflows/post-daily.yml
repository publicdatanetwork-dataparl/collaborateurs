name: Daily → Buffer (X + Bluesky)
on:
  schedule:
    - cron: "45 6 * * *"   # 08:45 à Paris (heure d'été) — après la mise à jour des listes
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/post-daily.mjs
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.Dataparl_buffer_api }}
          DAILY_BASE: https://www.dataparl.fr/daily
          LIENS_BASE: https://www.dataparl.fr/l
