name: DataParl' Jobs — offre de test
on:
  push:
    paths:
      - scripts/offre-test.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deposer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/offre-test.mjs
        env:
          SUPABASE_URL: ${{ secrets.JOBS_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.JOBS_SUPABASE_SERVICE_KEY }}
