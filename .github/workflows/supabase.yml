name: Synchro Supabase

on:
  workflow_dispatch:
    inputs:
      tout:
        description: "Inclure l'historique (Regards Citoyens, Wayback)"
        default: true
        type: boolean
  workflow_run:
    workflows: ["Historique Wayback"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: synchro-supabase
  cancel-in-progress: false

jobs:
  synchro:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Synchro
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOUT: ${{ github.event_name == 'workflow_run' || inputs.tout }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY manquants."
            exit 1
          fi
          if [ "$TOUT" = "true" ]; then python -m collabs supabase --tout; else python -m collabs supabase; fi

      # Revalidation à la demande de dataparl.fr (PR #29 webapp) : rafraîchit
      # les pages vitrines une fois les données du jour dans Supabase. Silencieux
      # si le secret n'est pas configuré, sans jamais faire échouer la synchro.
      - name: Rafraîchir dataparl.fr
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "Secret REVALIDATE_SECRET absent : revalidation de dataparl.fr ignorée."
            exit 0
          fi
          code=$(curl -sS -o /tmp/revalidate.json -w "%{http_code}" -X POST \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            https://www.dataparl.fr/api/revalidate || echo 000)
          cat /tmp/revalidate.json 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::warning::Revalidation de dataparl.fr a renvoyé HTTP $code (non bloquant)."
          fi
