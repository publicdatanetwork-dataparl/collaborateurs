name: Synchro Supabase

on:
  workflow_dispatch:
    inputs:
      tout:
        description: "Inclure l'historique (Regards Citoyens, Wayback)"
        default: true
        type: boolean
  workflow_run:
    workflows: ["Historique Wayback"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: synchro-supabase
  cancel-in-progress: false

jobs:
  synchro:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Synchro
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOUT: ${{ github.event_name == 'workflow_run' || inputs.tout }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY manquants."
            exit 1
          fi
          if [ "$TOUT" = "true" ]; then python -m collabs supabase --tout; else python -m collabs supabase; fi
